<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1c1917;--mut:#78716c;--brand:#15803d;--line:#d6d3cd;--g:#16a34a;--y:#f59e0b;--r:#dc2626;--on:#fff;--ease-spring:cubic-bezier(0.16,1,0.3,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0a09;--card:#1c1917;--ink:#fafaf9;--mut:#a8a29e;--brand:#1db954;--line:#44403c;--on:#003d20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0a09;--card:#1c1917;--ink:#fafaf9;--mut:#a8a29e;--brand:#1db954;--line:#44403c;--on:#003d20;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Kannada",sans-serif;padding-bottom:108px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:1.25rem;letter-spacing:.2px}
header .sub{font-size:.78rem;opacity:.82}
header select{width:auto;max-width:45%;padding:6px 8px;border-radius:8px;border:0;font:inherit}
.header-actions{display:flex;align-items:center;gap:8px}
main{max-width:720px;margin:0 auto;padding:14px}
h2{font-size:1.05rem;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-left-width:6px;border-radius:8px;padding:12px;margin:0 0 10px;box-shadow:0 2px 10px rgba(28,25,23,.035);transition:transform .28s var(--ease-spring),box-shadow .28s var(--ease-spring),background-color .2s var(--ease-spring)}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(28,25,23,.08)}
.card.g{border-left-color:var(--g)}.card.y{border-left-color:var(--y)}.card.r{border-left-color:var(--r)}
.card.n{border-left-color:var(--line)}
.card.r{animation:pulseGlow 3.2s ease-in-out infinite}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.mut{color:var(--mut);font-size:.9rem}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:600;color:#fff}
.chip.g{background:var(--g);color:#082b16}.chip.y{background:var(--y);color:#222}.chip.r{background:var(--r)}.chip.n{background:var(--mut)}
.ledger{display:flex;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:8px 0}
.ledger div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;min-width:0;transition:flex .5s var(--ease-spring)}
.ledger .y{color:#222}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{font-size:1.6rem;display:block}
.stat small{display:block;font-size:.75rem}
.dash-actions{border-left:6px solid var(--brand)}
.risk-section{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--line);border-radius:8px;padding:12px;margin:14px 0;transition:transform .28s var(--ease-spring),box-shadow .28s var(--ease-spring)}
.risk-section:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(28,25,23,.08)}
.risk-section.g{border-left-color:var(--g)}.risk-section.y{border-left-color:var(--y)}.risk-section.r{border-left-color:var(--r)}
.risk-section.n{border-left-color:var(--line)}
.risk-section.r{animation:pulseGlow 3.2s ease-in-out infinite}
.risk-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.risk-head h2{margin:0}
.risk-section>p{margin:6px 0 12px;color:var(--mut)}
.risk-section .card{margin-bottom:8px}
.recent-products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.recent-product{width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px}
.recent-product b{overflow-wrap:anywhere}
.recent-product small{color:var(--mut);font-size:.8rem}
.recent-product.selected{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.form-card,.settings-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:0 0 14px;box-shadow:0 2px 10px rgba(28,25,23,.035)}
.form-card h3,.settings-card h3{margin:0 0 4px;font-size:1rem}
.form-hint{margin:0 0 12px;color:var(--mut);font-size:.86rem}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qty-stepper{display:flex;align-items:center;gap:10px}
.qty-stepper button{width:44px;height:44px;padding:0;font-size:1.25rem}
.qty-stepper input{max-width:90px;text-align:center}
.settings-group{margin:0 0 22px}
.settings-group>h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 2px 10px}
.settings-row{display:flex;align-items:center;gap:12px}
.settings-icon{width:40px;height:40px;flex:none;border-radius:8px;background:color-mix(in srgb,var(--brand) 12%,transparent);display:grid;place-items:center;color:var(--brand);font-weight:800}
.settings-copy{flex:1;min-width:0}
.settings-copy b{display:block}
.settings-copy p{margin:2px 0 0;color:var(--mut);font-size:.86rem}
.theme-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.theme-option{background:var(--bg);color:var(--mut);border:1px solid var(--line);padding:10px 6px}
.theme-option.selected{background:color-mix(in srgb,var(--brand) 12%,var(--card));border-color:var(--brand);color:var(--brand)}
.brand-panel{display:flex;align-items:center;gap:14px}
.brand-mark{width:48px;height:48px;display:grid;place-items:center;border-radius:8px;background:var(--brand);color:var(--on);font-size:1.05rem;font-weight:800}
.brand-panel p{margin:2px 0 0;color:var(--mut);font-size:.88rem}
details.settings-card{padding:0}
details.settings-card summary{padding:14px 16px;cursor:pointer;font-weight:700}
details.settings-card>div{padding:0 16px 16px}
label{display:block;margin:10px 0 3px;font-weight:600;font-size:.92rem}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.in{display:flex;gap:6px}.in button{flex:none}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--brand);color:var(--on);font:inherit;font-weight:600;cursor:pointer;transition:transform .24s var(--ease-spring),background-color .2s var(--ease-spring),color .2s var(--ease-spring),box-shadow .24s var(--ease-spring)}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
button:active:not(:disabled){transform:scale(.96)}
button.s{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button.d{background:var(--r);color:#fff}
button.sm{padding:6px 10px;font-size:.88rem}
button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
nav{position:fixed;left:16px;right:16px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 26px rgba(28,25,23,.12);overflow:hidden}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 2px;font-size:.82rem}
nav button.on{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;display:none;z-index:5}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center;z-index:6}
#modal>div{background:var(--card);width:100%;max-width:520px;padding:16px;border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:8px;animation:sheetIn .5s var(--ease-spring) both}
.err{color:var(--r);font-weight:600}
.score-panel{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 13%,var(--card)),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 28px rgba(28,25,23,.06)}
.score-gauge{width:116px;height:116px;flex:none;position:relative}
.score-gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-track,.score-value{fill:none;stroke-width:10}
.score-track{stroke:var(--line)}
.score-value{stroke:var(--brand);stroke-linecap:round;stroke-dasharray:276.46;stroke-dashoffset:276.46;transition:stroke-dashoffset .9s var(--ease-spring),stroke .3s var(--ease-spring)}
.score-number{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.score-number strong{font-size:1.6rem}
.score-copy h2{margin:0 0 4px;font-size:1.05rem}
.score-copy p{margin:0;color:var(--mut);font-size:.88rem}
.score-grade{display:inline-flex;margin-top:8px;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--brand) 16%,var(--card));color:var(--brand);font-weight:800;font-size:.82rem}
.horizon{margin:14px 0 18px}
.horizon-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.horizon-head h2{margin:0}
.horizon-strip{display:grid;grid-template-columns:repeat(7,minmax(54px,1fr));gap:6px;overflow-x:auto;padding:8px 2px 10px}
.horizon-day{min-width:54px;padding:8px 4px;background:var(--card);color:var(--ink);border:1px solid var(--line);text-align:center;display:grid;gap:2px}
.horizon-day small{font-size:.68rem;color:var(--mut)}
.horizon-day b{font-size:1rem}
.horizon-day.has-items{border-color:var(--y);background:color-mix(in srgb,var(--y) 10%,var(--card))}
.horizon-day.today{box-shadow:inset 0 0 0 2px var(--brand)}
.horizon-day .count{font-size:.72rem;color:var(--brand);font-weight:700}
.horizon-clear{font-size:.78rem}
.onboarding{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:clamp(12px,4vw,36px);background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--brand) 22%,transparent),transparent 55%),var(--bg);overflow:auto}
.onboarding[hidden]{display:none}
.guide-card{width:min(100%,560px);max-height:min(92dvh,800px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(20px,5vw,36px);box-shadow:0 24px 80px rgba(0,0,0,.18);animation:guideIn .55s var(--ease-spring) both}
.guide-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.guide-language select{width:auto;max-width:130px;padding:6px;font-size:.8rem}
.guide-progress{display:flex;gap:5px}
.guide-progress i{width:22px;height:5px;border-radius:99px;background:var(--line)}
.guide-progress i.active{background:var(--brand)}
.guide-step-label{color:var(--mut);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.guide-card h2{font-size:clamp(1.5rem,5vw,2.25rem);line-height:1.15;letter-spacing:-.03em;margin:8px 0 10px}
.guide-card p{color:var(--mut);margin:0 0 16px}
.guide-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:22px}
.guide-actions-right{display:flex;gap:8px}
.hero-logo-wrap{position:relative;width:140px;height:140px;margin:8px auto 22px;display:grid;place-items:center}
.hero-ring,.hero-logo{position:absolute;border-radius:30px}
.hero-ring{inset:8px;border:1px solid color-mix(in srgb,var(--brand) 55%,transparent);animation:ringPulse 2.8s ease-out infinite}
.hero-ring:nth-child(2){inset:-4px;animation-delay:.9s}
.hero-logo{width:82px;height:82px;display:grid;place-items:center;background:linear-gradient(145deg,#35d276,#07863a);color:white;font-size:1.6rem;font-weight:900;box-shadow:0 16px 38px color-mix(in srgb,var(--brand) 40%,transparent);animation:logoFloat 3s var(--ease-spring) infinite}
.warm-greeting{text-align:center}
.risk-demo{display:grid;gap:9px;margin:18px 0}
.risk-demo-row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.risk-demo-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem}
.risk-demo-row.g .risk-demo-dot{background:color-mix(in srgb,var(--g) 20%,var(--card))}
.risk-demo-row.y .risk-demo-dot{background:color-mix(in srgb,var(--y) 22%,var(--card))}
.risk-demo-row.r .risk-demo-dot{background:color-mix(in srgb,var(--r) 18%,var(--card))}
.countdown{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.countdown span{display:block;height:100%;border-radius:9px;background:var(--brand);transform-origin:left;animation:countdownFill 2.5s var(--ease-spring) both}
.risk-demo-row.y .countdown span{background:var(--y);width:50%}
.risk-demo-row.r .countdown span{background:var(--r);width:20%}
.risk-demo-row.g .countdown span{width:92%}
.practice-card{padding:18px;background:linear-gradient(145deg,color-mix(in srgb,var(--brand) 12%,var(--card)),var(--card));border:1px solid var(--line);border-radius:18px}
.practice-card .sample-icon{font-size:2rem}
.practice-success{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--g) 15%,var(--card));color:var(--brand);font-weight:700}
.guide-ready{padding:14px;border-radius:16px;background:color-mix(in srgb,var(--brand) 10%,var(--card));display:flex;gap:12px;align-items:center}
.guide-ready .ready-check{font-size:1.8rem}
.guide-store-name{margin:12px 0}
.sound-toggle{display:flex;align-items:center;gap:10px}
.sound-toggle input{width:auto}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:21}
@keyframes pulseGlow{0%,100%{box-shadow:0 2px 10px rgba(239,68,68,.05)}50%{box-shadow:0 5px 20px rgba(239,68,68,.16)}}
@keyframes sheetIn{from{transform:translateY(100%);opacity:.7}to{transform:translateY(0);opacity:1}}
@keyframes guideIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes ringPulse{0%{transform:scale(.82);opacity:.75}100%{transform:scale(1.35);opacity:0}}
@keyframes countdownFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(max-width:480px){.stats{gap:6px}.stat{padding:8px}.stat b{font-size:1.35rem}main{padding:10px}.form-grid{grid-template-columns:1fr}}
@media(max-width:430px){.score-panel{gap:10px;padding:12px}.score-gauge{width:94px;height:94px}.score-copy p{font-size:.8rem}.header-actions{gap:4px}header{padding:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

 <div class="theme-options">${['system','light','dark'].map(x=>`<button class="theme-option ${S.theme==x?'selected':''}" aria-pressed="${S.theme==x}" onclick="setTheme('${x}')">${t(x)}</button>`).join('')}</div></div></section>
 <section class="settings-group"><h2>${t('general')}</h2><div class="settings-card"><div class="settings-row"><div class="settings-icon">N</div><div class="settings-copy"><b>${t('notif')}</b></div><button class="sm" onclick="notif()">${t('notif')}</button></div></div>
 <label class="settings-card settings-row sound-toggle" for="soundToggle"><div class="settings-icon">♪</div><div class="settings-copy"><b>${t('sound')}</b><p>${t('soundHelp')}</p></div><input id="soundToggle" type="checkbox" ${S.sound?'checked':''} onchange="S.sound=this.checked;save()"></label>
 <div class="settings-card"><div class="settings-row"><div class="settings-icon">G</div><div class="settings-copy"><b>${t('guest')}</b><p>${t('guestHelp')}</p></div></div></div>
 <div class="settings-card"><div class="settings-row"><div class="settings-icon">i</div><div class="settings-copy"><b>${t('privacy')}</b><p>${t('privacyHelp')}</p></div></div></div></section>
 ${accountPanel()}
 <section class="settings-group"><h2>${t('data')}</h2><div class="settings-card"><div class="settings-row"><div class="settings-icon">↓</div><div class="settings-copy"><b>${t('csv')}</b><p>${t('exportHelp')}</p></div><button class="sm" onclick="exportCSV()">${t('csv')}</button></div></div>
 <details class="settings-card"><summary>${t('backup')}</summary><div><p class="form-hint">${t('backupHelp')}</p><textarea id="bk" rows="6">${esc(JSON.stringify(S,null,2))}</textarea><p class="form-hint">${t('restoreHint')}</p><div class="acts"><button class="sm" onclick="copyBackup()">${t('copyBackup')}</button><button class="s sm" onclick="restore()">${t('restore')}</button></div></div></details></section>`}};
const tabs=['dash','stock','add','hist','set'];
function isServiceRoleKey(key){if(/^sb_secret_/i.test(key))return true;const parts=key.split('.');if(parts.length!=3)return false;
 try{let payload=parts[1].replace(/-/g,'+').replace(/_/g,'/');payload+='='.repeat((4-payload.length%4)%4);return JSON.parse(atob(payload)).role=='service_role'}catch(e){return false}}
function supabaseConfig(){const url=(localStorage.getItem('freshalert_supabase_url')||'').replace(/\/+$/,''),key=localStorage.getItem('freshalert_supabase_key')||'';
 if(!url||!key)throw new Error(t('configMissing'));
 if(isServiceRoleKey(key))throw new Error(t('unsafeKey'));
 let parsed;try{parsed=new URL(url)}catch(e){throw new Error(t('configInvalid'))}
 if(parsed.protocol!='https:'&&!(parsed.protocol=='http:'&&['localhost','127.0.0.1'].includes(parsed.hostname)))throw new Error(t('configInvalid'));
 const identity=url+'|'+key;if(supabaseIdentity&&supabaseIdentity!==identity){authSession=null;authUser=null;localStorage.removeItem('freshalert_supabase_session')}supabaseIdentity=identity;
 return{url,key}}
async function supabaseRequest(path,{method='GET',body,token,prefer}={}){
 const {url,key}=supabaseConfig(),headers={apikey:key,Authorization:'Bearer '+(token||key)};
 if(body!==undefined)headers['Content-Type']='application/json';
 if(prefer)headers.Prefer=prefer;
 const response=await fetch(url+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
 const text=await response.text();let data=null;
 if(text){try{data=JSON.parse(text)}catch(e){data=text}}
 if(!response.ok){const detail=data&&(data.msg||data.message||data.error_description||data.error)||response.statusText;throw new Error(String(detail||t('authError')))}
 return data}
function persistSession(session){
 if(!session||!session.access_token){authSession=null;authUser=null;localStorage.removeItem('freshalert_supabase_session');return}
 const rawExpiry=Number(session.expires_at),expiresAt=rawExpiry?(rawExpiry<1e12?rawExpiry*1000:rawExpiry):Date.now()+Number(session.expires_in||3600)*1000;
 authSession={...session,expires_at:expiresAt,project:supabaseIdentity};
 authUser=authSession.user||authUser;
 localStorage.setItem('freshalert_supabase_session',JSON.stringify(authSession))}
async function ensureSupabase(){
 const {url,key}=supabaseConfig(),identity=url+'|'+key;
 if(supabaseIdentity!==identity){supabaseIdentity=identity;authSession=null;authUser=null}
 if(!authSession){try{authSession=JSON.parse(localStorage.getItem('freshalert_supabase_session')||'null')}catch(e){authSession=null}}
 if(authSession&&authSession.project!==identity){authSession=null;authUser=null;localStorage.removeItem('freshalert_supabase_session')}
 if(authSession&&authSession.access_token&&Number(authSession.expires_at)>Date.now()+30000){authUser=authSession.user||null;return authSession}
 if(authSession&&authSession.refresh_token){
  const refreshed=await supabaseRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:authSession.refresh_token},token:key});
  persistSession(refreshed);return authSession}
 authSession=null;authUser=null;return null}
async function saveSupabaseConfig(){const url=$('#sb_url').value.trim().replace(/\/+$/,''),key=$('#sb_key').value.trim();
 if(!url||!key){authNotice=t('configMissing');render();return}
 if(isServiceRoleKey(key)){authNotice=t('unsafeKey');render();return}
 try{localStorage.setItem('freshalert_supabase_url',url);localStorage.setItem('freshalert_supabase_key',key)}catch(e){authNotice=String(e&&e.message||t('authError'));render();return}
 authBusy=true;authNotice='';render();try{await ensureSupabase();authNotice=t('configReady')}catch(e){authNotice=String(e&&e.message||t('authError'))}finally{authBusy=false;render()}}
async function accountAction(action){const email=$('#auth_email').value.trim(),password=$('#auth_password').value;
 if(!email||!password){authNotice=t('authRequired');render();return}
 authBusy=true;authNotice='';render();try{const {key}=supabaseConfig();
  const result=action=='signup'?await supabaseRequest('/auth/v1/signup',{method:'POST',body:{email,password},token:key}):
   await supabaseRequest('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password},token:key});
  if(result&&result.access_token){persistSession(result);authNotice=t('configReady')}
  else{authUser=result&&result.user||null;authNotice=action=='signup'?t('authConfirm'):t('authError')}}
 catch(e){authNotice=String(e&&e.message||t('authError'))}finally{authBusy=false;render()}}
async function signOut(){authBusy=true;authNotice='';render();try{await ensureSupabase();if(authSession)await supabaseRequest('/auth/v1/logout',{method:'POST',token:authSession.access_token});
  persistSession(null);authNotice=t('signedOut')}
 catch(e){authNotice=String(e&&e.message||t('authError'))}finally{authBusy=false;render()}}
function askCloud(action){if(!authUser){authNotice=t('authRequired');render();return}
 const copy=action=='upload'?t('uploadConfirm'):t('restoreConfirm'),label=action=='upload'?t('uploadCloud'):t('restoreCloud');
 mod(`<p>${esc(copy)}</p><div class="acts"><button onclick="runCloud('${action}')">${label}</button><button class="s" onclick="mod()">${t('cancel')}</button></div>`)}
function normalizeCloudSnapshot(data){const validDate=x=>Number.isFinite(dateValue(x));
 if(!data||!Array.isArray(data.batches)||!Array.isArray(data.log))throw new Error(t('cloudInvalid'));
 const ids=new Set(),statuses=['active','sold','removed','ret','disp','nf'];
 const batches=data.batches.map(b=>{if(!b||typeof b!='object'||!Number.isSafeInteger(Number(b.id))||typeof b.name!='string'||!b.name.trim()||!validDate(b.exp)||!Number.isInteger(Number(b.qty))||Number(b.qty)<1||!statuses.includes(b.status||'active')||(b.mfg&&!validDate(b.mfg)))throw new Error(t('cloudInvalid'));
  const id=Number(b.id);if(ids.has(id))throw new Error(t('cloudInvalid'));ids.add(id);
  return {...b,id,name:b.name,brand:typeof b.brand=='string'?b.brand:'',no:typeof b.no=='string'?b.no:'',mfg:typeof b.mfg=='string'?b.mfg:'',exp:b.exp,
   qty:Number(b.qty),status:b.status||'active',rem:Array.isArray(b.rem)?b.rem.filter(x=>x=='r1'||x=='r2'):[],hist:Array.isArray(b.hist)?b.hist.map(String):[]}});
 const log=data.log.map(l=>{if(!l||typeof l!='object'||!['r1','r2'].includes(l.k))throw new Error(t('cloudInvalid'));
  return {...l,name:String(l.name||''),no:String(l.no||''),at:String(l.at||'')}});
 return{batches,log}}
async function runCloud(action){mod();authBusy=true;authNotice='';render();try{await ensureSupabase();if(!authUser||!authSession)throw new Error(t('authRequired'));
  const token=authSession.access_token;
  if(action=='upload'){await supabaseRequest('/rest/v1/inventory_snapshots?on_conflict=user_id',{method:'POST',token,prefer:'resolution=merge-duplicates,return=minimal',
    body:{user_id:authUser.id,data:{batches:S.batches,log:S.log},updated_at:new Date().toISOString()}});authNotice=t('cloudSaved')}
  else{const rows=await supabaseRequest('/rest/v1/inventory_snapshots?select=data&user_id=eq.'+encodeURIComponent(authUser.id)+'&limit=1',{token});
   if(!Array.isArray(rows)||!rows.length){authNotice=t('cloudNoData')}else{const snapshot=normalizeCloudSnapshot(rows[0].data);S.batches=snapshot.batches;S.log=snapshot.log;save();authNotice=t('cloudRestored')}}}
 catch(e){authNotice=String(e&&e.message||t('authError'))}finally{authBusy=false;render()}}
function go(x){if(x=='add'&&tab!='add'&&editId==null)pendingProduct=null;tab=x;if(x!='add'){editId=null;err=''}render();
 if(x=='set'&&localStorage.getItem('freshalert_supabase_url'))ensureSupabase().then(()=>{if(tab=='set')render()}).catch(e=>{authNotice=String(e&&e.message||t('authError'));if(tab=='set')render()});
 scrollTo(0,0)}
function render(keep){reminders();save();$('#lg').value=S.lang;document.documentElement.lang=S.lang;$('#subtitle').textContent=t('tagline');$('#guideLabel').textContent=t('guideBtn');
 if(S.theme=='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=S.theme;
 $('#nav').innerHTML=tabs.map(x=>`<button class="${tab==x?'on':''}" onclick="go('${x}')">${t(x)}</button>`).join('');
 $('#main').innerHTML=views[tab]();
 const gauge=$('.score-value');if(gauge)requestAnimationFrame(()=>gauge.style.strokeDashoffset=gauge.dataset.offset);
 if(keep&&$('#q')){const e=$('#q');e.focus();e.setSelectionRange(e.value.length,e.value.length)}
 checkHealthMilestone()}
function saveB(){const g=k=>$('#f_'+k).value.trim();const o={name:g('name'),brand:g('brand'),cat:g('cat')||'Other',mfg:g('mfg'),exp:g('exp'),qty:Number(g('qty'))};
 if(!o.name||!Number.isSafeInteger(o.qty)||o.qty<1||!Number.isFinite(dateValue(o.mfg))||!Number.isFinite(dateValue(o.exp)))return fail(o,t('errr'));
 if(dateValue(o.mfg)>=dateValue(o.exp))return fail(o,t('errd'));
 if(editId){const b=S.batches.find(x=>x.id==editId),oldDates=b.exp+b.mfg,oldQty=Number(b.qty)||0,oldLeft=stockLeft(b);Object.assign(b,o);b.remaining=Math.min(o.qty,Math.max(0,oldLeft+o.qty-oldQty));b.ver=b.remaining;b.hist=b.hist||[];b.hist.push(new Date().toLocaleDateString()+': edit');
  if(oldDates!=b.exp+b.mfg){b.acks={};b.rem=[]}}
 else{let id=Date.now();while(S.batches.some(b=>b.id==id))id++;S.batches.push({id,status:'active',rem:[],acks:{},hist:[],ver:null,remaining:o.qty,...o})}
 editId=null;err='';pendingProduct=null;tab='stock';render();toast(t('ok'))}
function fail(o,m){err=m;
 const vals={};['name','brand','cat','mfg','exp','qty'].forEach(k=>vals[k]=$('#f_'+k).value);
 render();Object.keys(vals).forEach(k=>$('#f_'+k).value=vals[k]);scrollTo(0,0)}
function removeTracking(id){const b=S.batches.find(x=>x.id==id);if(!b)return;mod(`<p>${t('removeConfirm')}</p><div class="acts"><button class="d" onclick="bRemove(${id})">${t('remove')}</button><button class="s" onclick="mod()">${t('cancel')}</button></div>`)}
function bRemove(id){const b=S.batches.find(x=>x.id==id);if(b){b.status='removed';b.hist=b.hist||[];b.hist.push(new Date().toLocaleString()+': '+t('removed'))}mod();render()}
function mod(h){const m=$('#modal');if(!h){m.style.display='none';m.setAttribute('aria-hidden','true');return}$('#mbox').innerHTML=h;m.style.display='flex';m.setAttribute('aria-hidden','false');
 const first=m.querySelector('button,input');if(first)first.focus()}
function openV(id,stage){const b=S.batches.find(x=>x.id==id),ack=b&&b.acks&&b.acks[stage];if(!ack||ack.response)return;
 mod(`<b>${t('verify')} · ${t(stage=='r1'?'stage50':'stage25')}</b><p>${esc(b.name)} · ${t('onhand')}: ${stockLeft(b)}</p>
 <button onclick="respond(${id},'${stage}','there')">${t('there')}</button>
 <label for="vq">${t('responseQty')}</label><div class="in"><input id="vq" type="number" min="1" step="1" inputmode="numeric" aria-label="${t('responseQty')}"><button onclick="respond(${id},'${stage}','few')">${t('few')}</button></div>
 <button class="d" onclick="respond(${id},'${stage}','sold')">${t('allSold')}</button><button class="s" onclick="mod()">${t('cancel')}</button>`)}
function respond(id,stage,response){const b=S.batches.find(x=>x.id==id),ack=b&&b.acks&&b.acks[stage];if(!ack||ack.response)return;
 const before=stockLeft(b);let updatedQuantity=null;
 if(response=='few'){const field=$('#vq'),n=field?Number(field.value):NaN,limit=b.status=='sold'?Number(b.qty):before;if(!Number.isSafeInteger(n)||n<1||n>limit){toast(t('responseQtyError'));return}updatedQuantity=n;b.remaining=n;b.ver=n}
 if(response=='sold'){b.remaining=0;b.ver=0;b.status='sold'}
 const at=new Date().toLocaleString();ack.response=response;ack.respondedAt=at;ack.qtyAtResponse=before;ack.updatedQuantity=updatedQuantity;
 S.log.unshift({id:b.id,name:b.name,k:stage,at,kind:'response',response,qtyAtResponse:before,updatedQuantity});
 b.hist=b.hist||[];b.hist.push(at+': '+t(response=='there'?'there':response=='few'?'few':'allSold')+(updatedQuantity!=null?' ('+updatedQuantity+')':''));
 mod();render();toast(t('ok'))}
function exportCSV(){try{const rows=[['Product','Brand','Category','Quantity at registration','Current quantity','Manufacturing date','Expiry date','Tracking status']];
 const cell=v=>{let s=String(v??'');if(/^\s*['"=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
 S.batches.forEach(b=>rows.push([b.name,b.brand,b.cat,b.qty,stockLeft(b),b.mfg,b.exp,b.status||'active']));
 const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='kiranasmart-products.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){toast(t('badcsv'))}}
async function notif(){try{if(!window.Notification)throw new Error('unsupported');const p=await Notification.requestPermission();if(p!='granted')toast(t('nonot'));else toast(t('ok'))}catch(e){toast(t('nonot'))}}
function restore(){try{const o=JSON.parse($('#bk').value);if(!o||!Array.isArray(o.batches)||!Array.isArray(o.log))throw 0;S=o;S.lang=S.lang||'en';if(!['system','light','dark'].includes(S.theme))S.theme='system';migrateAcknowledgements();render();toast(t('ok'))}catch(e){toast(t('bad'))}}
$('#modal').addEventListener('click',e=>{if(e.target.id=='modal')mod()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){if(guideOpen)skipGuide();else if($('#modal').style.display=='flex')mod()}});
document.addEventListener('keydown',e=>{if(e.key!='Tab')return;const container=guideOpen?$('#onboarding .guide-card'):$('#modal').style.display=='flex'?$('#mbox'):null;if(!container)return;
 const focusable=[...container.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')];if(!focusable.length)return;
 const first=focusable[0],last=focusable[focusable.length-1];
 if(e.shiftKey&&(document.activeElement===first||document.activeElement===container)){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
document.addEventListener('click',e=>{const button=e.target.closest&&e.target.closest('button');if(button&&S.sound)playAudioCue('click')});
resizeConfetti();render();if(guideOpen){setGuideBackground(true);renderGuide()}
setInterval(()=>{reminders();save();if(document.visibilityState==='visible')render()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')render()});
</script></body></html>
